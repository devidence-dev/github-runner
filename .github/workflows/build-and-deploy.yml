name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      runner_version:
        description: "GitHub Actions Runner CLI version (e.g. 2.334.0)"
        required: true
        default: "2.334.0"

jobs:
  build:
    name: Build and push image
    runs-on: self-hosted
    permissions:
      contents: read
      id-token: write # required so this job can request a GitHub OIDC token for Infisical
    outputs:
      image_tag: ${{ inputs.runner_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch GHCR_TOKEN from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: "oidc"
          identity-id: "77942652-da93-4daa-9f33-62534699496b"
          domain: "https://app.infisical.com"
          project-slug: "homelab-devidence"
          env-slug: "prod"
          secret-path: "/cross"
          export-type: "env"

      - name: Login to ghcr.io
        run: docker login ghcr.io -u ${{ github.actor }} -p "$GHCR_TOKEN"

      - name: Build image
        run: |
          docker build \
            --build-arg RUNNER_VERSION=${{ inputs.runner_version }} \
            -f Dockerfile \
            -t ghcr.io/devidence-dev/github-runner:${{ inputs.runner_version }} \
            .

      - name: Push to GHCR
        run: docker push ghcr.io/devidence-dev/github-runner:${{ inputs.runner_version }}

  deploy:
    name: Update homelab
    needs: build
    runs-on: self-hosted
    environment: production
    steps:
      - name: Update image tag in homelab
        env:
          HOMELAB_DEPLOY_TOKEN: ${{ secrets.HOMELAB_DEPLOY_TOKEN }}
        run: |
          rm -rf /tmp/homelab-runner-deploy
          git clone https://x-access-token:${HOMELAB_DEPLOY_TOKEN}@github.com/devidence-dev/homelab.git /tmp/homelab-runner-deploy
          cd /tmp/homelab-runner-deploy
          sed -i "s|tag: .*|tag: \"${{ needs.build.outputs.image_tag }}\"|" \
            kubernetes/infrastructure/github-runner/values.yaml
          git config user.email "ci@devidence.dev"
          git config user.name "homelab-ci"
          git add kubernetes/infrastructure/github-runner/values.yaml
          git commit -m "chore(github-runner): bump image to ${{ needs.build.outputs.image_tag }}"
          git push
          rm -rf /tmp/homelab-runner-deploy
